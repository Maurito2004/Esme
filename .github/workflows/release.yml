# Compila Esme en los servidores Windows de GitHub y publica un Release con el exe listo
# para usar cada vez que se sube un tag de versión (v1.2.3).
#   git tag -a v0.4.0 -m "..." && git push origin v0.4.0
# Las notas de la versión se leen de docs/release-notes/<tag>.md.
#
# Firma de código (SignPath Foundation): el exe se firma cuando existen la variable
# SIGNPATH_ORGANIZATION_ID y el secreto SIGNPATH_API_TOKEN del repo. Mientras no estén,
# el paso se saltea y se publica sin firmar, como antes. Cómo configurarlo: docs/signpath/README.md
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # compilación manual (solo artefacto, sin release)

permissions:
  contents: write
  actions: read # SignPath descarga el artefacto sin firmar de esta ejecución

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust estable (MSVC)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V

      - name: Compilar
        shell: pwsh
        run: cargo build --release --locked

      - name: Tests
        shell: pwsh
        run: cargo test --release --locked

      # Lo que firma SignPath: un zip con Esme.exe en la raíz
      # (ver docs/signpath/artifact-configuration.xml).
      - name: Subir exe sin firmar
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Esme-unsigned
          path: target/release/Esme.exe
          if-no-files-found: error

      - name: Firmar con SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Esme' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Usar el exe firmado
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          Copy-Item signed\Esme.exe target\release\Esme.exe -Force
          Get-AuthenticodeSignature target\release\Esme.exe | Format-List Status, SignerCertificate

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory | Out-Null
          Copy-Item target\release\Esme.exe dist\Esme.exe
          Compress-Archive -Path target\release\Esme.exe, README.md, LICENSE -DestinationPath "dist\Esme-${{ github.ref_name }}-portable.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Esme-${{ github.ref_name }}
          path: dist/*

      - name: Notas con la politica de firma
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $repo = "https://github.com/${{ github.repository }}"
          $notes = (Get-Content -Raw "docs/release-notes/${{ github.ref_name }}.md").TrimEnd()
          $footer = "`n`n---`n**[Code signing policy]($repo#code-signing-policy)** | [Privacy policy]($repo#privacy-policy) | [Uninstall]($repo#uninstall)`n"
          Set-Content -Path release-notes.md -Value ($notes + $footer) -Encoding utf8NoBOM -NoNewline

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Esme ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
