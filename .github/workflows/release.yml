# Compila Esme en los servidores Windows de GitHub y publica un Release con el exe listo
# para usar cada vez que se sube un tag de versión (v1.2.3).
#   git tag -a v0.4.0 -m "..." && git push origin v0.4.0
# Las notas de la versión se leen de docs/release-notes/<tag>.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # compilación manual (solo artefacto, sin release)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust estable (MSVC)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V

      - name: Compilar
        shell: pwsh
        run: cargo build --release --locked

      - name: Tests
        shell: pwsh
        run: cargo test --release --locked

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory | Out-Null
          Copy-Item target\release\Esme.exe dist\Esme.exe
          Compress-Archive -Path target\release\Esme.exe, README.md -DestinationPath "dist\Esme-${{ github.ref_name }}-portable.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Esme-${{ github.ref_name }}
          path: dist/*

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Esme ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: dist/*
